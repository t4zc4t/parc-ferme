name: Backfill archive

# run by hand to fill archive/, the updater archives new seasons itself
on:
  workflow_dispatch:
    inputs:
      first:
        description: First season
        default: "1950"
      last:
        description: Last season (blank for last year)
        default: ""

permissions: {}

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: store
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Fetch missing seasons
        env:
          PF_STORE: store
          # via env, not inlined
          FIRST: ${{ inputs.first }}
          LAST: ${{ inputs.last }}
        run: |
          git -C store config user.name Foraxsys
          git -C store config user.email 247897238+t4zc4t@users.noreply.github.com
          python pipeline/backfill.py "$FIRST" "$LAST"
