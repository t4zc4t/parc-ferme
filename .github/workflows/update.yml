name: Update data

# worker/timer.js starts this every 10 min, the cron here is just a backup
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if nothing is due
        type: boolean
        default: true

permissions: {}

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # push to the data branch
      actions: write    # keep this schedule switched on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: store
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Check for new data
        env:
          PF_STORE: store
          PF_FORCE: ${{ inputs.force && '1' || '' }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          git -C store config user.name Foraxsys
          git -C store config user.email 247897238+t4zc4t@users.noreply.github.com
          python pipeline/update.py
      - name: Keep the schedule switched on
        # github disables crons after 60 quiet days
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%H)" -lt 6 ]; then
            gh api -X PUT "repos/$REPO/actions/workflows/update.yml/enable" && echo "schedule kept alive"
          fi

  # three failed runs in a row open an issue, the next good run closes it
  alert:
    needs: update
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RESULT: ${{ needs.update.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Data updates are failing"
          open=$(gh issue list -R "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "$RESULT" = "success" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" -R "$REPO" --comment "Back to normal with $RUN"
            fi
            exit 0
          fi
          [ "$RESULT" = "failure" ] || exit 0
          failed=$(gh run list -R "$REPO" --workflow update.yml --status completed --limit 2 --json conclusion --jq '[.[] | select(.conclusion == "failure")] | length')
          if [ "$failed" -ge 2 ] && [ -z "$open" ]; then
            gh issue create -R "$REPO" --title "$title" \
              --body "The last three runs of Update data failed, the latest is $RUN. The site keeps showing the last good data. This closes by itself once a run goes through."
          fi

