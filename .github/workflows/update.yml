name: Update data

# worker/timer.js starts this every 10 min, the cron here is just a backup
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Refresh even if nothing is due
        type: boolean
        default: true

permissions: {}

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # push to the data branch
      actions: write    # keep this schedule switched on
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: store
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Check for new data
        env:
          PF_STORE: store
          PF_FORCE: ${{ inputs.force && '1' || '' }}
          CF_DEPLOY_HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          git -C store config user.name Foraxsys
          git -C store config user.email 247897238+t4zc4t@users.noreply.github.com
          python pipeline/update.py
      - name: Keep the schedule switched on
        # github disables crons after 60 quiet days
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(date -u +%H)" -lt 6 ]; then
            gh api -X PUT "repos/$REPO/actions/workflows/update.yml/enable" && echo "schedule kept alive"
          fi
